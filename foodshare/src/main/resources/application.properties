spring.application.name=foodshare
server.port=${SERVER_PORT:8080}


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodsharedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false


spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true


app.jwt.secret=${JWT_SECRET:CHANGE_ME_USE_ENV_VARIABLE}
app.jwt.access-token-expiration-in-seconds=${JWT_ACCESS_EXPIRATION:86400}
app.jwt.refresh-token-expiration-in-seconds=${JWT_REFRESH_EXPIRATION:2592000}


app.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}


app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://localhost:4173}


app.default-admin.phone=${DEFAULT_ADMIN_PHONE:0987654321}
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:admin@foodshare.com}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:CHANGE_ME_USE_ENV_VARIABLE}
app.default-admin.full-name=${DEFAULT_ADMIN_FULLNAME:FoodShare Administrator}


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}


spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
management.endpoint.health.probes.enabled=true
