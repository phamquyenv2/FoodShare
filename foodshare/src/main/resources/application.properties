spring.application.name=foodshare
spring.config.import=optional:file:.env[.properties],optional:file:foodshare/.env[.properties]
server.port=${SERVER_PORT:8080}


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodsharedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.log_slow_query=${DB_SLOW_QUERY_THRESHOLD_MS:250}
spring.jpa.open-in-view=false


spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true

# Payment gateways (sandbox by default; credentials must be supplied via environment)
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.query-endpoint=${MOMO_QUERY_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/query}
momo.refund-endpoint=${MOMO_REFUND_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/refund}
momo.refund-query-endpoint=${MOMO_REFUND_QUERY_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/refund/query}
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:5173/payment/result}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payments/momo/callback}

zalopay.endpoint=${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
zalopay.query-endpoint=${ZALOPAY_QUERY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/query}
zalopay.refund-endpoint=${ZALOPAY_REFUND_ENDPOINT:https://sb-openapi.zalopay.vn/v2/refund}
zalopay.refund-query-endpoint=${ZALOPAY_REFUND_QUERY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/query_refund}
zalopay.app-id=${ZALOPAY_APP_ID:}
zalopay.key1=${ZALOPAY_KEY1:}
zalopay.key2=${ZALOPAY_KEY2:}
zalopay.redirect-url=${ZALOPAY_REDIRECT_URL:http://localhost:5173/payment/result}
zalopay.callback-url=${ZALOPAY_CALLBACK_URL:http://localhost:8080/api/payments/zalopay/callback}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
app.notification.page-size=15
app.security.rate-limit.auth-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}
app.security.rate-limit.upload-per-minute=${UPLOAD_RATE_LIMIT_PER_MINUTE:20}

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-in-seconds=${JWT_ACCESS_EXPIRATION:900}
app.jwt.refresh-token-expiration-in-seconds=${JWT_REFRESH_EXPIRATION:2592000}


app.google.client-id=${GOOGLE_CLIENT_ID:}

app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Strict}


app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://localhost:4173}


app.default-admin.phone=${DEFAULT_ADMIN_PHONE:0987654321}
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:admin@foodshare.com}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:}
app.default-admin.full-name=${DEFAULT_ADMIN_FULLNAME:FoodShare Administrator}


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


# Geoapify geocoding
geoapify.api-key=${GEOAPIFY_API_KEY:}
geoapify.base-url=${GEOAPIFY_BASE_URL:https://api.geoapify.com}
geoapify.timeout-ms=${GEOAPIFY_TIMEOUT_MS:5000}
app.security.rate-limit.geocoding-per-minute=${GEOCODING_RATE_LIMIT_PER_MINUTE:30}

# Infobip 2FA phone OTP
infobip.base-url=${INFOBIP_BASE_URL:https://api.infobip.com}
infobip.api-key=${INFOBIP_API_KEY:}
infobip.application-id=${INFOBIP_APPLICATION_ID:}
infobip.message-id=${INFOBIP_MESSAGE_ID:}
infobip.sender=${INFOBIP_SENDER:}
infobip.timeout-ms=${INFOBIP_TIMEOUT_MS:5000}


firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

spring.mail.default-encoding=UTF-8
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
management.endpoint.health.probes.enabled=true

# Upload configuration
app.upload.max-documents=${MAX_DOCUMENTS:5}
app.upload.max-document-size-mb=${MAX_DOCUMENT_SIZE_MB:10}
spring.servlet.multipart.max-file-size=${app.upload.max-document-size-mb:10}MB
spring.servlet.multipart.max-request-size=${app.upload.max-document-size-mb:10}MB

# Platform Fee configuration
app.platform-fee.percentage=${PLATFORM_FEE_PERCENTAGE:0.05}

# SMTP delivery is opt-in; MAIL_FROM defaults to the authenticated mailbox.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}
spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}
management.health.mail.enabled=${MAIL_ENABLED:false}
